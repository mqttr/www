{% load static tailwind_tags %}
{% load component_tags %}
<!DOCTYPE html>
<html lang='en' class="h-full min-h-full">
    <head>
        {% block title %}
        <title>CHANGE ME</title>
        {% endblock %}
        <meta charset="UTF-8" >
        {% tailwind_css %}
        {% block add_css %}{% endblock %}
    </head>
    <body class="bg-gray-900 flex flex-col h-screen justify-between">
        {% component "header" / %}
        <main role="main" class="grid min-h-fit place-items-center px-6 py-24 sm:py-32 lg:px-8">
            {% block content %}
            <div class="text-center">
                <h1 class="mt-4 text-4xl font-semibold tracking-tight text-balance text-white sm:text-7xl">CHANGE ME</h1>
            </div>
            {% endblock %}
        </main>
        {% component "footer" / %}
    </body>
</html>
